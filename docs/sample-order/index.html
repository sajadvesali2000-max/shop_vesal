<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>نمونهٔ ثبت سفارش — وصال</title>
  <meta name="theme-color" content="#0b0f2a" />
  <style>
    :root{--bg:#0b0f2a;--card:#11142a;--accent:#1d9a8b}
    *{box-sizing:border-box}
    body{margin:0;font-family:Tahoma,Segoe UI,Arial,sans-serif;background:var(--bg);color:#fff;padding:20px}
    .wrap{max-width:720px;margin:18px auto}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.02));padding:18px;border-radius:12px}
    label{display:block;margin-top:12px;font-weight:700}
    input,textarea{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:#fff;color:#111}
    button{margin-top:16px;padding:12px 16px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}
    .status{margin-top:12px;font-weight:700}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2 style="text-align:center">نمونهٔ ثبت سفارش</h2>
      <p style="text-align:center;opacity:0.85">این یک پروژهٔ نمونه است. بعد از deploy، دکمهٔ «ثبت سفارش» پیامی به تلگرام ارسال می‌کند.</p>

      <label for="name">نام و نام خانوادگی</label>
      <input id="name" placeholder="مثلاً: علی رضایی" />

      <label for="phone">شماره تماس</label>
      <input id="phone" placeholder="مثلاً: 09123456789" />

      <label for="addr">آدرس</label>
      <textarea id="addr" rows="3" placeholder="شهر، خیابان، پلاک"></textarea>

      <button id="submit">ثبت سفارش</button>
      <div class="status" id="status"></div>

      <hr style="margin-top:18px;border-color:rgba(255,255,255,0.04)" />
      <div style="font-size:13px;opacity:0.85">این نمونه به Chat ID زیر ارسال می‌کند: <b>233880219</b></div>
      <div style="font-size:13px;opacity:0.85">توجه: توکن بات باید به‌صورت امن در متغیر محیطی سرور قرار گیرد (TELEGRAM_BOT_TOKEN).</div>
    </div>
  </div>

  <script>
    // تغییر دهید اگر endpoint سرورلِس شما آدرس دیگری دارد
    // اگر در Vercel/Netlify مستقر می‌کنید، معمولا آدرس: /api/send-order
    var ORDER_URL = '/sample-order/api/send-order'; // برای deploy محلی یا روی سرورِ شما ممکن است نیاز به تغییر باشد

    function normalizePhone(s){ return (s||'').replace(/[^0-9]/g,''); }

    document.getElementById('submit').addEventListener('click', async function(){
      var status = document.getElementById('status');
      var name = document.getElementById('name').value.trim();
      var phone = normalizePhone(document.getElementById('phone').value);
      var addr = document.getElementById('addr').value.trim();

      if(!name || !phone){ status.textContent = 'لطفاً نام و شماره را وارد کنید.'; return; }

      status.textContent = 'در حال ارسال...';
      this.disabled = true;

      var payload = { name: name, phone: phone, address: addr, qty: 1 };

      try{
        var res = await fetch(ORDER_URL, {
          method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify(payload)
        });
        var j = await res.json();
        if(res.ok && j && j.ok){ status.textContent = 'سفارش ارسال شد ✅';
          document.getElementById('name').value=''; document.getElementById('phone').value=''; document.getElementById('addr').value='';
        } else { console.error(j); status.textContent = 'خطا در ارسال سفارش: '+(j && j.error? j.error : 'نامشخص'); }
      }catch(err){ console.error(err); status.textContent = 'خطای شبکه یا سرور.'; }
      this.disabled = false;
    });
  </script>
</body>
</html>
