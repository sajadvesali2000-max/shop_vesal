      c1: [ { u:'رضا', r:4, t:'چله سنتی تمیز و دقیق آماده شد.' } ]
    };

    /* ---------- PWA install ---------- */
    var deferredPrompt = null;
    function isStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
    function isTelegram(){ return !!(tg && typeof tg.initData === 'string' && tg.initData.length > 0); }

        list += '<div class="prod"><span class="thumb" onclick="openDetail(\''+p.id+'\')" style="cursor:pointer">'+p.emoji+'</span>'
          + '<span class="info" onclick="openDetail(\''+p.id+'\')" style="cursor:pointer"><span class="pname">'+p.name+'</span>'+(priceLabel(p)?('<span class="pprice">'+priceLabel(p)+'</span>'):'')+rtxt+'</span>'
          + '<span class="padd">'+right+'</span></div>';
      }
      if(count===0) list='<div class="empty"><div class="big">🔍</div><div>محصولی یافت نشد</div></div>';
      return list;
    }
    function setFilter(c){ state.filter=c; haptic(); render(); }
    function onSearch(v){ state.search=v; var box=document.getElementById('prodList'); if(box) box.innerHTML=buildProdList(); }

    function screenDetail(){
      var p=findProduct(state.detail);

        '<div class="card center">'

        + (priceLabel(p)?('<div class="pprice" style="font-size:15px;margin-bottom:10px">'+priceLabel(p)+'</div>'):'')

    function screenCart(){
      if(cart.length===0){
        paint('<div class="card"><h2>🛒 سبد خرید</h2><div class="empty"><div class="big">🛒</div><div>سبد خرید شما خالی است</div><button class="btn order" style="margin-top:18px" onclick="go(\'shop\')">مشاهده محصولات</button></div></div>');

      }
      var items='';
      for(var i=0;i<cart.length;i++){
        var p=findProduct(cart[i].id); if(!p) continue;
        var lineTotal = p.price>0 ? money(p.price*cart[i].qty) : '';
        items += '<div class="citem"><span class="thumb">'+p.emoji+'</span>'
          + '<span class="cinfo"><span class="cname">'+p.name+'</span>'+(lineTotal?('<span class="cprice">'+lineTotal+'</span>'):'')+'</span>'
          + '<div class="stepper"><button class="st-btn" onclick="decCart(\''+p.id+'\')">−</button><span class="st-val">'+cart[i].qty+'</span><button class="st-btn" onclick="incCart(\''+p.id+'\')">+</button></div>'
          + '<button class="trash" onclick="removeCart(\''+p.id+'\')">🗑️</button></div>';

      var total=cartTotal();
      var disc=discountAmount(); var pay=payableTotal();
      var couponBox = coupon
        ? '<div class="coupon-on"><span>✅ کد <b>'+esc(coupon.code)+'</b> ('+esc(coupon.label)+') اعمال شد</span><button class="coupon-x" onclick="removeCoupon()">حذف</button></div>'
        : '<div class="coupon-row"><input id="couponInput" type="text" placeholder="کد تخفیف (مثلا VESAL10)" /><button class="coupon-btn" onclick="applyCoupon()">اعمال</button></div><div class="field-hint" id="couponMsg">کدهای فعال: VESAL10 و VESAL20 و WELCOME15</div>';
      var discRow = disc>0 ? '<div class="srow"><span>تخفیف ('+esc(coupon.label)+')</span><span style="color:#7dffcf">- '+money(disc)+'</span></div>' : '';
      paint(
        '<div class="card">'
        + '<h2>🛒 سبد خرید</h2>'
        + '<div class="h2sub">'+cartCount()+' مورد در سبد شما</div>'
        + items
        + '<div style="margin:6px 0 4px">'+couponBox+'</div>'
        + '<div class="summary"><div class="srow"><span>تعداد اقلام</span><span>'+cartCount()+'</span></div>'
        + (total>0 ? '<div class="srow"><span>جمع اقلام</span><span>'+money(total)+'</span></div>' : '')
        + discRow
        + (total>0 ? '<div class="srow total"><span>مبلغ قابل پرداخت</span><b>'+money(pay)+'</b></div>' : '')
        + '</div>'
        + '<button class="btn order" onclick="go(\'checkout\')">ادامه و تکمیل سفارش ‹</button>'
        + '<button class="btn back" onclick="go(\'shop\')">افزودن محصول بیشتر</button>'
        + '</div>'
      );
    }

    function screenCheckout(){
      var lines='';
      for(var i=0;i<cart.length;i++){ var p=findProduct(cart[i].id); if(!p) continue; lines+='<div class="srow"><span>'+p.name+' × '+cart[i].qty+'</span><span></span></div>'; }
      var total=cartTotal();
      var disc=discountAmount(); var pay=payableTotal();
      var discRow = disc>0 ? '<div class="srow"><span>تخفیف ('+esc(coupon.label)+')</span><span style="color:#7dffcf">- '+money(disc)+'</span></div>' : '';
      paint(
        '<div class="card">'
        + '<h2>📝 تکمیل سفارش</h2>'
        + '<div class="h2sub">اطلاعات خود را وارد کنید</div>'
        + '<div class="summary" style="border-top:none;padding-top:0;margin-bottom:16px">'+lines+ (total>0?((disc>0?('<div class="srow"><span>جمع اقلام</span><span>'+money(total)+'</span></div>'):'') + discRow + '<div class="srow total"><span>مبلغ قابل پرداخت</span><b>'+money(pay)+'</b></div>'):'')+'</div>'
        + '<label>نام و نام خانوادگی</label>'
        + '<input id="fName" type="text" maxlength="'+NAME_MAX+'" placeholder="نام شما" oninput="validateName()" />'
        + '<div class="field-hint" id="nameHint">بین '+NAME_MIN+' تا '+NAME_MAX+' کاراکتر</div>'
        + '<label>شماره تماس</label>'
        + '<input id="fPhone" type="tel" inputmode="numeric" placeholder="مثلا 09123456789" oninput="validatePhone()" />'
        + '<div class="field-hint" id="phoneHint">شماره موبایل ۱۱ رقمی که با ۰۹ شروع شود</div>'
        + '<label>آدرس تحویل</label>'
        + '<textarea id="fAddr" placeholder="شهر، خیابان، پلاک و کد پستی"></textarea>'
        + '<div class="field-hint">اختیاری ولی برای ارسال سریع‌تر توصیه می‌شود</div>'
        + '<label>توضیحات سفارش</label>'
        + '<textarea id="fNote" placeholder="رنگ، اندازه یا توضیحات دلخواه"></textarea>'
        + '<div class="field-hint">اختیاری</div>'
        + '<button class="btn order" id="orderBtn" onclick="submitOrder()">🛒 ثبت نهایی سفارش</button>'
        + '<div id="status"></div>'
        + '<button class="btn back" onclick="go(\'cart\')">↩️ بازگشت به سبد</button>'
        + '</div>'
      );
    }

    function screenSuccess(){
      paint(
        '<div class="card center">'
        + '<div class="success-ic">✅</div>'
        + '<h2 class="center">سفارش شما ثبت شد!</h2>'
        + '<div class="h2sub center" style="margin-top:10px;line-height:2">با تشکر از خرید شما 🌸<br/>⏰ حداکثر ظرف یک روز با شما تماس گرفته می‌شود.</div>'
        + '<button class="btn order" onclick="go(\'home\')">بازگشت به خانه</button>'
        + '<button class="btn back" onclick="go(\'shop\')">خرید مجدد</button>'
        + '</div>'
      );

    function screenContact(){
      paint(
        '<div class="card">'
        + '<h2 class="center">📞 راه‌های ارتباطی</h2>'
        + '<div class="h2sub center">همیشه پاسخگوی شما هستیم</div>'
        + '<div class="contact-grid">'
        + '<a class="btn" href="tel:09155764756">☎️ ۰۹۱۵۵۷۶۴۷۵۶</a>'
        + '<a class="btn" href="tel:09157879170">☎️ ۰۹۱۵۷۸۷۹۱۷۰</a>'
        + '</div>'
        + '<div class="social-grid">'
        + '<a class="btn insta" href="https://www.instagram.com/vesal_handicraft" target="_blank">📸 اینستاگرام</a>'
        + '<a class="btn eitaa" href="https://eitaa.com/09155764756" target="_blank">🟢 ایتا</a>'
        + '<a class="btn rubika" href="https://rubika.ir/09155764756" target="_blank">🟣 روبیکا</a>'
        + '</div>'
        + '</div>'
        + '<div class="footer">فروشگاه صنایع دستی وصال 🌸</div>'
      );

    /* ---------- validation ---------- */
    function validateName(){
      var el=document.getElementById('fName'); var hint=document.getElementById('nameHint'); if(!el) return false;
      var v=(el.value||'').trim();
      if(v.length===0){ el.className=''; hint.className='field-hint'; hint.textContent='بین '+NAME_MIN+' تا '+NAME_MAX+' کاراکتر'; return false; }
      if(v.length<NAME_MIN){ el.className='invalid'; hint.className='field-hint err'; hint.textContent='نام باید حداقل '+NAME_MIN+' کاراکتر باشد.'; return false; }
      if(v.length>NAME_MAX){ el.className='invalid'; hint.className='field-hint err'; hint.textContent='نام نباید بیشتر از '+NAME_MAX+' کاراکتر باشد.'; return false; }
      el.className='valid'; hint.className='field-hint ok'; hint.textContent='✓ نام معتبر است'; return true;
    }
    function validatePhone(){
      var el=document.getElementById('fPhone'); var hint=document.getElementById('phoneHint'); if(!el) return false;
      var raw=el.value||'';
      if(raw.trim().length===0){ el.className=''; hint.className='field-hint'; hint.textContent='شماره موبایل ۱۱ رقمی که با ۰۹ شروع شود'; return false; }
      var norm=normalizePhone(raw);
      if(!/^[0-9\u06F0-\u06F9\u0660-\u0669+\- ]*$/.test(raw)){ el.className='invalid'; hint.className='field-hint err'; hint.textContent='شماره فقط باید عدد باشد.'; return false; }
      if(norm.length<11){ el.className='invalid'; hint.className='field-hint err'; hint.textContent='شماره کامل نیست ('+norm.length+' رقم وارد شده).'; return false; }
      if(!isValidPhone(raw)){ el.className='invalid'; hint.className='field-hint err'; hint.textContent='شماره موبایل معتبر نیست؛ باید ۱۱ رقم و با ۰۹ شروع شود.'; return false; }
      el.className='valid'; hint.className='field-hint ok'; hint.textContent='✓ شماره معتبر است: '+norm; return true;
    }

    /* ---------- submit ---------- */
<script>
function submitOrder(){
  var btn = document.getElementById('orderBtn');
  var status = document.getElementById('status');

  var okName = validateName();
  var okPhone = validatePhone();

  var nameEl = document.getElementById('fName');
  var phoneEl = document.getElementById('fPhone');

  if (!(nameEl.value || '').trim() || !(phoneEl.value || '').trim()) {
    status.textContent = '⚠️ لطفا نام و شماره تماس را وارد کنید.';
    return;
  }

  if (!okName) {
    status.textContent = '⚠️ نام وارد شده معتبر نیست.';
    nameEl.focus();
    return;
  }

  if (!okPhone) {
    status.textContent = '⚠️ شماره تماس معتبر نیست. لطفا اصلاح کنید.';
    phoneEl.focus();
    return;
  }

  if (cart.length === 0) {
    status.textContent = '⚠️ سبد خرید خالی است.';
    return;
  }

  var n = (nameEl.value || '').trim();
  var p = normalizePhone(phoneEl.value);

  var addrEl = document.getElementById('fAddr');
  var noteEl = document.getElementById('fNote');

  var addr = addrEl ? (addrEl.value || '').trim() : '';
  var note = noteEl ? (noteEl.value || '').trim() : '';

  var u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
    ? tg.initDataUnsafe.user
    : {};

  var lines = [];
  var totalQty = 0;

  for (var i = 0; i < cart.length; i++) {
    var pr = findProduct(cart[i].id);

    if (!pr) continue;

    totalQty += cart[i].qty;

    lines.push(
      '• ' +
      pr.name +
      ' — ' +
      cart[i].qty +
      ' ' +
      pr.unit
    );
  }

  var total = cartTotal();
  var disc = discountAmount();
  var pay = payableTotal();

  var message =
    '🛍️ سفارش جدید فروشگاه صنایع دستی وصال\n' +
    '━━━━━━━━━━━━━━━━━━\n\n' +

    '👤 نام مشتری: ' + n + '\n' +
    '📞 شماره تماس: ' + p + '\n';

  if (u.username) {
    message += '👤 یوزرنیم تلگرام: @' + u.username + '\n';
  }

  if (u.id) {
    message += '🆔 Telegram ID: ' + String(u.id) + '\n';
  }

  message += '\n📦 محصولات:\n';

  if (lines.length > 0) {
    message += lines.join('\n') + '\n';
  }

  message += '\n🔢 تعداد اقلام: ' + totalQty + '\n';

  if (total > 0) {
    message += '💰 مبلغ اصلی: ' + money(total) + '\n';

    if (disc > 0 && coupon) {
      message +=
        '🎟️ تخفیف: ' +
        coupon.label +
        ' (' +
        coupon.code +
        ')\n';

      message += '➖ مبلغ تخفیف: ' + money(disc) + '\n';
      message += '💵 مبلغ نهایی: ' + money(pay) + '\n';
    }
  } else {
    message += '💰 قیمت: هنگام تماس اعلام می‌شود\n';
  }

  if (addr) {
    message +=
      '\n📍 آدرس تحویل:\n' +
      addr +
      '\n';
  }

  if (note) {
    message +=
      '\n📝 توضیحات سفارش:\n' +
      note +
      '\n';
  }

  message +=
    '\n━━━━━━━━━━━━━━━━━━\n' +
    '🌸 فروشگاه صنایع دستی وصال';

  /*
   * باز کردن چت @vesalcotton با متن آماده سفارش
   */
  var telegramUrl =
    'https://t.me/vesalcotton?text=' +
    encodeURIComponent(message);

  btn.disabled = true;
  status.textContent = 'در حال آماده‌سازی سفارش...';

  try {
    if (tg && typeof tg.openLink === 'function') {
      tg.openLink(telegramUrl);
    } else {
      window.open(telegramUrl, '_blank');
    }

    /*
     * فقط بعد از باز شدن تلگرام،
     * سبد و کوپن پاک می‌شوند.
     */
    cart = [];
    saveCart();

    coupon = null;
    saveCoupon(null);

    haptic('ok');

    state.tab = 'success';
    render();

  } catch (e) {
    console.error(e);

    status.textContent =
      '❌ باز کردن تلگرام انجام نشد. دوباره امتحان کنید.';

    btn.disabled = false;
  }
}
</script>
